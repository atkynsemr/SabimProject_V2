<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="../../dist/img/logo.png" />
  <title>SabimWEB | Giriş Ekranı</title>
  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="../../plugins/icheck-bootstrap/icheck-bootstrap.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <!-- /.login-logo -->
        <div class="card card-outline card-primary">
            <div class="card-header text-center">
                <a href="" class="h1"><b>Sabim</b>WEB</a>
            </div>
            <div class="card-body">
                <p class="login-box-msg text-secondary font-weight-bolder">Oturumu başlatmak için giriş yapınız</p>
                <form action="../../index3.html" id="LoginForm" method="post">
                    <div class="input-group form-group mb-3">
                        <input type="text" name="user" class="form-control" id="InputLoginUser" placeholder="Kullanıcı Adı">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group form-group mb-3">
                        <input type="password" name="password" class="form-control" id="InputLoginPassword" placeholder="Parola">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-8">
                            <div class="icheck-primary">
                                <input type="checkbox" id="remember">
                                <label for="remember" class="text-dark">
                                    Beni Hatırla
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="social-auth-links text-center mt-2 mb-3">
                        <button type="submit" class="btn btn-block btn-primary">
                            <i class="fa fa-arrow-circle-right mr-2"></i> Giriş Yapınız
                        </button>
                    </div>
                </form>

                <p class="mb-1">
                    <a href="forgot-password-v2.html" class="text-secondary font-weight-bolder"><i class="fa fa-envelope mr-2"></i>Şifremi Unuttum</a>
                </p>
            </div>
            <!-- /.card-body -->
        </div>
        <!-- /.card -->
    </div>
    <!-- /.login-box -->
    <!-- jQuery -->
    <!-- Bootstrap 4 -->
    <!-- AdminLTE App -->
    <!-- jquery-validation -->
    <script src="../../plugins/jquery-validation/jquery.validate.min.js"></script>
    <script src="../../plugins/jquery-validation/additional-methods.min.js"></script>
    <!-- AdminLTE App -->




    <script src="/AdminTemplate/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="/AdminTemplate/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- jquery-validation -->
    <script src="/AdminTemplate/plugins/jquery-validation/jquery.validate.min.js"></script>
    <script src="/AdminTemplate/plugins/jquery-validation/additional-methods.min.js"></script>
    <!-- AdminLTE App -->
    <script src="/AdminTemplate/dist/js/adminlte.min.js"></script>












    <!-- Page specific script -->
    <script>
        $(function() {
            $('#LoginForm').validate({
                rules: {
                    user: {
                        required: true
                    },
                    password: {
                        required: true
                    }
                },
                messages: {
                    user: {
                        required: "Lütfen kullanıcı adınızı giriniz"
                    },
                    password: {
                        required: "Lütfen şifrenizi giriniz"
                    }
                },
                errorElement: 'span',
                errorPlacement: function(error, element) {
                    error.addClass('invalid-feedback');
                    element.closest('.form-group').append(error);
                },
                highlight: function(element, errorClass, validClass) {
                    $(element).addClass('is-invalid');
                },
                unhighlight: function(element, errorClass, validClass) {
                    $(element).removeClass('is-invalid');
                }
            });
        });
    </script>
</body>
</html>
